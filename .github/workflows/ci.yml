name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Validate catalog manifests
        run: go run ./cmd/validate catalog
      - name: Security scan (gosec)
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest && gosec -quiet ./...
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  images:
    if: github.ref == 'refs/heads/main'
    needs: [go, web]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    strategy:
      matrix: { cmd: [gateway, runner, egress] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.services
          target: ${{ matrix.cmd == 'runner' && 'runner' || 'runtime' }}
          build-args: CMD=${{ matrix.cmd }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.cmd }}:latest
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository }}-${{ matrix.cmd }}:latest
